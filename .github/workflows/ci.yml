name: CI Pipeline for Next.js Service
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
permissions:
  contents: read
env:
  NODE_VERSION: '20'
  IMAGE_NAME: chatbot-ui
  IMAGE_TAG: ${{ github.sha }}
  APP_NAME: chatbot-ui
  APP_PORT: '3000'
  HEALTH_CHECK_RETRIES: '10'
  HEALTH_CHECK_DELAY: '3'
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/chatbot-ui
jobs:
  validate-code:
    name: 'Validate: Code Quality'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      id: checkout
      uses: actions/checkout@v4
    - name: Setup Node.js
      id: setup-node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm
    - name: Install dependencies
      id: install-deps
      run: npm ci
    - name: Run ESLint
      id: eslint
      if: ${{ env.ACT != 'true' }}
      run: npm run lint
    - name: Check Prettier formatting
      id: prettier
      if: ${{ env.ACT != 'true' }}
      run: npm run format:check
    - name: Type check with TypeScript
      id: type-check
      if: ${{ env.ACT != 'true' }}
      run: npm run type-check
  test-unit:
    name: 'Test: Unit Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - validate-code
    steps:
    - name: Checkout
      id: checkout
      uses: actions/checkout@v4
    - name: Setup Node.js
      id: setup-node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm
    - name: Install dependencies
      id: install-deps
      run: npm ci
    - name: Run Jest tests with coverage
      id: run-tests
      if: ${{ env.ACT != 'true' }}
      run: npm test -- --coverage --ci
    - name: Upload test artifacts
      id: upload-test-artifacts
      uses: actions/upload-artifact@v4
      if: ${{ always() && env.ACT != 'true' }}
      with:
        name: ci-artifacts-test
        path: |
          reports
          coverage
        retention-days: 7
        if-no-files-found: warn
    - name: Upload build artifacts
      id: upload-artifacts
      uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: ci-artifacts
        path: |
          reports
          dist
        if-no-files-found: warn
  build-package:
    name: 'Build: Application and Docker'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
    - test-unit
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      id: checkout
      uses: actions/checkout@v4
    - name: Setup Node.js
      id: setup-node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm
    - name: Install dependencies
      id: install-deps
      run: npm ci
    - name: Build Next.js production bundle
      id: build-nextjs
      run: npm run build
    - name: Set up Docker Buildx
      id: setup-buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to GitHub Container Registry
      id: docker-login
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build Docker image for scanning
      id: build-docker-local
      uses: docker/build-push-action@v5
      with:
        context: .
        load: true
        push: false
        tags: '${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}'
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Scan Docker image for vulnerabilities
      id: trivy-scan
      uses: aquasecurity/trivy-action@0.36.0
      with:
        image-ref: ${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}
        format: table
        exit-code: '1'
        severity: CRITICAL,HIGH
    - name: Push Docker image to GHCR
      id: build-docker-push
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}
          ${{ env.GHCR_IMAGE }}:latest
        cache-from: type=gha
    - name: Upload build artifacts
      id: upload-artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ci-artifacts-build
        path: |
          reports
          dist
        if-no-files-found: warn
  deploy-ec2:
    name: 'Deploy: EC2 Deployment'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - build-package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
    - name: Deploy to EC2
      id: deploy-to-ec2
      uses: appleboy/ssh-action@v1.0.3
      env:
        SECRET_GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SECRET_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        SECRET_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        SECRET_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        envs: SECRET_GHCR_TOKEN,SECRET_SUPABASE_ANON_KEY,SECRET_SUPABASE_URL,SECRET_SUPABASE_SERVICE_KEY
        script: |
          set -e

          echo "Logging in to GHCR..."
          echo "$SECRET_GHCR_TOKEN" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

          echo "Pulling new image..."
          docker pull ${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}

          echo "Stopping existing container..."
          docker stop ${{ env.APP_NAME }} || true
          docker rm ${{ env.APP_NAME }} || true

          echo "Starting new container..."
          docker run -d \
            --name ${{ env.APP_NAME }} \
            -p ${{ env.APP_PORT }}:3000 \
            --restart unless-stopped \
            --memory=512m \
            --cpus=1.0 \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY="$SECRET_SUPABASE_ANON_KEY" \
            -e NEXT_PUBLIC_SUPABASE_URL="$SECRET_SUPABASE_URL" \
            -e SUPABASE_SERVICE_ROLE_KEY="$SECRET_SUPABASE_SERVICE_KEY" \
            ${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}

          echo "Running health check..."
          for i in $(seq 1 ${{ env.HEALTH_CHECK_RETRIES }}); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:${{ env.APP_PORT }}/ || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health check passed on attempt $i (HTTP $HTTP_STATUS)"
              exit 0
            fi
            echo "Attempt $i failed (HTTP $HTTP_STATUS), retrying in ${{ env.HEALTH_CHECK_DELAY }}s..."
            sleep ${{ env.HEALTH_CHECK_DELAY }}
          done

          echo "Health check failed after ${{ env.HEALTH_CHECK_RETRIES }} attempts"
          echo "--- Container logs ---"
          docker logs --tail 100 ${{ env.APP_NAME }}
          echo "--- End logs ---"
          echo "Rolling back..."
          docker stop ${{ env.APP_NAME }} || true
          docker rm ${{ env.APP_NAME }} || true
          exit 1
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true