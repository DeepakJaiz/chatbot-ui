name: Next.js Service CI/CD
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
permissions:
  contents: read
env:
  NODE_VERSION: '20'
  IMAGE_NAME: nextjs-service
  IMAGE_TAG: ${{ github.sha }}
  GHCR_REGISTRY: ghcr.io
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
  APP_NAME: nextjs-service
  APP_PORT: '7777'
jobs:
  source-test:
    name: 'Source: Install, Lint & Test'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      id: checkout
      uses: actions/checkout@v4
    - name: Setup Node
      id: setup-node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm
    - name: Install Dependencies
      id: install
      run: npm ci
    - name: Run Lint
      id: lint
      run: npm run lint
      if: ${{ env.ACT != 'true' }}
    - name: Run Tests
      id: test
      run: npm test
      if: ${{ env.ACT != 'true' }}
    - name: Upload artifacts
      id: upload-artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ci-artifacts
        path: |
          reports/
          dist/
        if-no-files-found: warn
  package-build:
    name: 'Package: Build & Push Docker'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - source-test
    permissions:
      packages: write
    steps:
    - name: Checkout
      id: checkout
      uses: actions/checkout@v4
    - name: Setup Node
      id: setup-node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm
    - name: Install Dependencies
      id: install
      run: npm ci
    - name: Build Next.js App
      id: build
      run: npm run build
    - name: Set up Docker Buildx
      id: docker-setup
      uses: docker/setup-buildx-action@v3
    - name: Login to GHCR
      id: docker-login
      uses: docker/login-action@v3
      with:
        registry: ${{ env.GHCR_REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and Push Docker Image
      id: docker-build-push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ env.GHCR_REGISTRY }}/${{ toLower(github.repository_owner) }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          ${{ env.GHCR_REGISTRY }}/${{ toLower(github.repository_owner) }}/${{ env.IMAGE_NAME }}:latest
    - name: Scan Image with Trivy
      id: trivy-scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ env.GHCR_REGISTRY }}/${{ toLower(github.repository_owner) }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        exit-code: '1'
        severity: HIGH,CRITICAL
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ci-artifacts
        path: |
          reports/
          dist/
        if-no-files-found: warn
  deploy-production:
    name: 'Deploy: SSH to EC2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - package-build
    environment: production
    steps:
    - name: Checkout
      id: checkout
      uses: actions/checkout@v4
    - name: Deploy via SSH
      id: deploy-ec2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.EC2_HOST }}
        username: ubuntu
        key: ${{ env.EC2_SSH_KEY }}
        script: |
          set -e
          GHCR_USER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          GHCR_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          IMAGE_PULL="${{ env.GHCR_REGISTRY }}/$GHCR_USER/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          CONTAINER_NAME="${{ env.APP_NAME }}-new"
          
          # Stop any existing container with this name
          docker rm -f $CONTAINER_NAME || true
          
          # Login and pull image
          echo "$GHCR_TOKEN" | docker login ${{ env.GHCR_REGISTRY }} -u $GHCR_USER --password-stdin
          docker pull $IMAGE_PULL
          
          # Run new container
          docker run -d --name $CONTAINER_NAME -p ${{ env.APP_PORT }}:8000 \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -e NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            -e SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            $IMAGE_PULL
          
          # Health check
          echo "Waiting for container to become healthy..."
          for i in $(seq 1 10); do
            sleep 3
            if docker exec $CONTAINER_NAME curl -sf http://localhost:8000 || true; then
              echo "Health check passed on attempt $i"
              break
            fi
            if [ $i -eq 10 ]; then
              echo "Health check failed after 10 attempts"
              docker logs $CONTAINER_NAME
              docker rm -f $CONTAINER_NAME
              exit 1
            fi
          done
          
          # Stop old container and rename new one
          docker stop ${{ env.APP_NAME }} || true
          docker rm ${{ env.APP_NAME }} || true
          docker rename $CONTAINER_NAME ${{ env.APP_NAME }}
          
          # Cleanup
          docker image prune -af
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true