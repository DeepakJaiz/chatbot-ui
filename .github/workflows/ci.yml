name: CI Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}
  APP_NAME: nextjs-app
  CONTAINER_PORT: '8000'
  HOST_PORT: '7777'

jobs:
  validate-code:
    name: 'Validate: Lint'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        id: install
        run: npm ci

      - name: Run Linter
        id: lint
        run: npm run lint

  test-unit:
    name: 'Test: Unit Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        id: install
        run: npm ci

      # - name: Run Tests
      #   id: test
      #   run: npm test

      # - name: Upload Test Results
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: test-results
      #     path: reports/
      #     if-no-files-found: warn

  build-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    needs:
      - validate-code
      - test-unit
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: setup-docker
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        id: login-ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        id: build
        run: |
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            --load .

      - name: Trivy Security Scan
        id: scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          exit-code: '1'
          severity: HIGH,CRITICAL
          format: table

      - name: Push Image
        id: push
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE_NAME }}:latest

  deploy-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - build-push
    environment: production
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        id: ssh-deploy
        uses: appleboy/ssh-action@v1.1.0
        timeout-minutes: 25
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            #!/bin/bash
            set -e
            
            IMAGE="ghcr.io/${{ github.repository }}:${{ github.sha }}"
            CONTAINER="${{ env.APP_NAME }}"
            
            # Login to GHCR using token from stdin (never exposed in logs)
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull new image
            docker pull "$IMAGE"
            
            # Tag current image for rollback (if exists)
            CURRENT_IMAGE=$(docker inspect --format='{{.Config.Image}}' "$CONTAINER" 2>/dev/null || echo "")
            if [ -n "$CURRENT_IMAGE" ]; then
              docker tag "$CURRENT_IMAGE" "${{ env.IMAGE_NAME }}:rollback"
            fi
            
            # Stop and remove old container if exists
            docker stop "$CONTAINER" 2>/dev/null || true
            docker rm "$CONTAINER" 2>/dev/null || true
            
            # Run new container with health check, non-root user, and resource limits
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              --user 1001:1001 \
              --memory=512m \
              --cpus=0.5 \
              -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} \
              "$IMAGE"
            
            # Health check (10 attempts, 3s sleep)
            MAX_RETRIES=10
            RETRY_COUNT=0
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if curl -sf "http://localhost:${{ env.HOST_PORT }}/api/health" > /dev/null 2>&1; then
                echo "Health check passed"
                break
              fi
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "Health check attempt $RETRY_COUNT/$MAX_RETRIES failed. Retrying in 3s..."
              sleep 3
            done
            
            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "Health check failed after $MAX_RETRIES attempts"
              docker logs "$CONTAINER"
              docker stop "$CONTAINER"
              docker rm "$CONTAINER"
              
              # Rollback to previous image if available
              if [ -n "$CURRENT_IMAGE" ]; then
                echo "Rolling back to previous version"
                docker run -d \
                  --name "$CONTAINER" \
                  --restart unless-stopped \
                  --user 1001:1001 \
                  --memory=512m \
                  --cpus=0.5 \
                  -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} \
                  "${{ env.IMAGE_NAME }}:rollback"
              fi
              exit 1
            fi
            
            # Cleanup old images
            docker image prune -af --filter "label!=keep"
            
            # Notify deployment status
            echo "Deployment successful for $IMAGE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
